# XcodeGen spec — run `xcodegen generate` to (re)create ReFripe.xcodeproj.
name: ReFripe
options:
  bundleIdPrefix: dev.eugenebessan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # ← mets ton Team ID Apple ici (ou choisis l'équipe dans Xcode)
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.3"   # pinned: API verified against this release; needs Xcode 16.3+
targets:
  ReFripe:
    type: application
    platform: iOS
    sources:
      - path: ReFripe
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: ReFripe/ReFripe.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.sensitivecontentanalysis.client: [analysis]
    info:
      path: ReFripe/Info.plist
      properties:
        CFBundleDisplayName: ReFripe
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - IBMPlexMono_400Regular.ttf
          - IBMPlexMono_500Medium.ttf
          - IBMPlexMono_600SemiBold.ttf
          - Manrope_400Regular.ttf
          - Manrope_500Medium.ttf
          - Manrope_600SemiBold.ttf
          - Manrope_700Bold.ttf
          - Manrope_800ExtraBold.ttf
          - Unbounded_400Regular.ttf
          - Unbounded_600SemiBold.ttf
          - Unbounded_700Bold.ttf
          - Unbounded_800ExtraBold.ttf
          - Unbounded_900Black.ttf
        NSPhotoLibraryUsageDescription: ReFripe a besoin de tes photos pour publier tes articles.
        NSCameraUsageDescription: ReFripe a besoin de l'appareil photo pour photographier tes articles.
        CFBundleURLTypes:
          - CFBundleURLName: dev.eugenebessan.refripe
            CFBundleURLSchemes: [refripe]
        # Read at runtime by AppConfig. Leave empty to run on demo data.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eugenebessan.refripe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    scheme:
      testTargets:
        - ReFripeTests
        - ReFripeUITests

  # Unit tests (business rules, demo repository) — hosted in the app, `@testable import ReFripe`.
  ReFripeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReFripeTests
    dependencies:
      - target: ReFripe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eugenebessan.refripe.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  # UI test: walks the main flow in demo mode and attaches a screenshot of each screen.
  ReFripeUITests:
    type: bundle.ui-test
    platform: iOS
    sources:
      - path: ReFripeUITests
    dependencies:
      - target: ReFripe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eugenebessan.refripe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
